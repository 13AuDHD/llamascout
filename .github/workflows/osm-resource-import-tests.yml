name: OSM Resource Import Integration
on:
  pull_request:
    branches: [main]
    paths:
      - 'app/osm-resource-import.php'
      - 'app/osm-resource-enrichment.php'
      - 'admin/resource-enrichment*.php'
      - 'admin/js/admin-resource-enrichment.js'
      - 'api/osm-resource-enrichment.php'
      - 'tools/migrations/20261128_osm_resource_enrichment.sql'
      - 'tools/tests/osm-resource-enrichment-mariadb.php'
      - 'app/osm-nearest-data.php'
      - 'api/osm-resource-import-worker.php'
      - 'admin/resource-map-data.php'
      - 'tools/migrations/20261127_osm_resource_import.sql'
      - 'tools/tests/osm-resource-import-mariadb.php'
      - 'app/osm-resource-local.php'
      - 'app/osm-resource-browser.php'
      - 'app/osm-resource-publication.php'
      - 'admin/resource-publication-step.php'
      - 'admin/js/admin-osm-resource-publication.js'
      - 'app/resource-map-query.php'
      - 'api/resources.php'
      - 'tools/tests/resource-map-query-mariadb.php'
      - 'app/resources.php'
      - 'app/admin-resources.php'
      - 'api/osm-resource-publications.php'
      - 'tools/migrations/20261127_osm_resource_publication.sql'
      - 'tools/tests/osm-resource-publication-mariadb.php'
      - 'app/osm-resource-pbf.php'
      - 'admin/resource-map-data-step.php'
      - 'admin/js/admin-osm-resource-import.js'
      - 'tools/migrations/20261127_osm_browser_import.sql'
      - 'tools/tests/osm-resource-browser-mariadb.php'
      - 'app/osm-resource-extract.py'
      - 'jobs/osm-resource-import.php'
      - '.github/workflows/osm-resource-import-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  staged-import:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: osm-import-test
          MARIADB_ROOT_HOST: "%"
          MARIADB_DATABASE: llama_osm_import_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - name: Install PHP extensions if required
        run: |
          if ! php -m | grep -qi '^pdo_mysql$' || ! php -m | grep -qi '^mbstring$'; then
            sudo apt-get update -qq
            sudo apt-get install -y php-mysql php-mbstring
          fi
      - name: Syntax checks
        run: |
          php -l app/osm-resource-import.php
          php -l app/osm-resource-enrichment.php
          php -l admin/resource-enrichment.php
          php -l admin/resource-enrichment-step.php
          php -l api/osm-resource-enrichment.php
          node --check admin/js/admin-resource-enrichment.js
          php -l api/osm-resource-import-worker.php
          php -l admin/resource-map-data.php
          php -l app/osm-resource-local.php
          php -l app/osm-resource-browser.php
          php -l app/osm-resource-publication.php
          php -l admin/resource-publication-step.php
          node --check admin/js/admin-osm-resource-publication.js
          php -l api/osm-resource-publications.php
          php -l api/resources.php
          php -l app/resource-map-query.php
          node --check js/map.js
          php -l app/osm-resource-pbf.php
          php -l admin/resource-map-data-step.php
          node --check admin/js/admin-osm-resource-import.js
          php -l jobs/osm-resource-import.php
          python -m py_compile app/osm-resource-extract.py
      - name: Verify atomic refresh and retry behavior
        env:
          LLAMA_OSM_TEST_DSN: mysql:host=127.0.0.1;port=3306;dbname=llama_osm_import_test;charset=utf8mb4
          LLAMA_OSM_TEST_USER: root
          LLAMA_OSM_TEST_PASSWORD: osm-import-test
        run: |
          php tools/tests/osm-resource-import-mariadb.php
          php tools/tests/osm-resource-browser-mariadb.php
          php tools/tests/osm-resource-publication-mariadb.php
          php tools/tests/osm-resource-enrichment-mariadb.php
          php tools/tests/resource-map-query-mariadb.php
