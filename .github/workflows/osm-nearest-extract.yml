name: OSM Extraction Tests
on:
  pull_request:
    paths:
      - 'app/osm-resource-extract.py'
      - 'tools/extract-osm-nearest.py'
      - 'tools/osm-nearest-to-sql.py'
      - 'tools/tests/osm-nearest-extraction.py'
      - '.github/workflows/osm-nearest-extract.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install osmium shapely
      - run: python tools/tests/osm-nearest-extraction.py
