name: Admin OSM Resource Import
on:
  workflow_dispatch:
    inputs:
      regions:
        description: JSON array of queued state slugs
        required: true
        type: string
      batch_id:
        description: Admin queue identifier
        required: true
        type: string

permissions:
  contents: read

jobs:
  import:
    if: github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        region: ${{ fromJSON(inputs.regions) }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Install extraction tools
        run: |
          sudo apt-get update
          sudo apt-get install -y osmium-tool
          python -m pip install osmium shapely
      - name: Extract and transfer state
        env:
          REGION: ${{ matrix.region }}
          BATCH: ${{ inputs.batch_id }}
          LLAMA_OSM_WORKER_KEY: ${{ secrets.LLAMA_OSM_WORKER_KEY }}
        run: |
          set -euo pipefail
          [[ "$REGION" =~ ^[a-z-]+$ ]]
          [[ "$BATCH" =~ ^[a-f0-9]{32}$ ]]
          curl --fail --location --retry 3 --output source.osm.pbf "https://download.geofabrik.de/north-america/us/${REGION}-latest.osm.pbf"
          timestamp="$(osmium fileinfo -g header.option.osmosis_replication_timestamp source.osm.pbf)"
          snapshot="${timestamp:0:10}"
          [[ "$snapshot" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]
          osmium tags-filter source.osm.pbf -o filtered.osm.pbf \
            'nwr/amenity=fuel,charging_station,drinking_water,toilets,hospital,sanitary_dump_station,shower,waste_disposal' \
            'nwr/shop=alcohol,wine,supermarket,grocery,convenience,laundry' \
            'nwr/place=city,town,village' 'nwr/healthcare=hospital' \
            'nwr/drinking_water=yes' 'nwr/fuel:propane=yes' 'nwr/propane=yes'
          python tools/extract-osm-nearest.py filtered.osm.pbf snapshot.ndjson --region "$REGION" --snapshot "$snapshot"
          python tools/send-osm-resource-snapshot.py --region "$REGION" --batch "$BATCH" --snapshot snapshot.ndjson
      - name: Record failure without replacing live data
        if: failure()
        env:
          REGION: ${{ matrix.region }}
          BATCH: ${{ inputs.batch_id }}
          LLAMA_OSM_WORKER_KEY: ${{ secrets.LLAMA_OSM_WORKER_KEY }}
        run: python tools/send-osm-resource-snapshot.py --region "$REGION" --batch "$BATCH" --fail
