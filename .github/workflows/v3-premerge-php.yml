name: V3 Pre-merge PHP Check

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/v3-premerge-php.yml'
      - '**/*.php'
      - 'js/place-report-warnings.js'
      - 'css/site/features/scout-warning-compact.css'
      - 'tools/tests/quick-warning-ui.cjs'
      - 'js/place-explorer.js'
      - 'css/site/features/place-explorer.css'
      - 'tools/tests/place-explorer-colors-ui.cjs'
      - 'tools/tests/area-purple-report-ui.cjs'
      - 'tools/tests/area-selection-deep-link-ui.cjs'
      - 'tools/tests/place-report-scope-visibility-ui.cjs'
      - 'tools/tests/place-area-scope-registry.php'
      - 'css/site/features/place-report-form.css'
      - 'js/place-campsites.js'
      - 'tools/tests/public-facility-resource-roles.cjs'
      - 'tools/tests/contribution-four-tab-switcher.cjs'
      - 'tools/tests/contribution-four-tab-switcher.php'
      - 'partials/place-report/contribution-tabs.php'
      - 'css/site/features/contribution-tabs.css'
      - 'resource-contribution.php'
      - 'add-place.php'
      - 'css/site.css'
      - 'css/map.css'
      - 'resource-contribution.php'
      - 'js/place-map.js'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  php-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: PHP syntax check for files changed from main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          mapfile -d '' files < <(git diff --name-only --diff-filter=ACMR -z origin/main...HEAD -- '*.php')
          printf 'Checking %s PHP files\n' "${#files[@]}"
          for file in "${files[@]}"; do
            php -l "$file"
          done
      - name: Verify reporting contract
        run: php tools/v3-launch-smoke.php
      - name: Verify single-target Admin save routing
        run: php tools/tests/admin-report-single-target.php
      - name: Verify Place-only submission and legacy compatibility
        run: php tools/tests/new-place-single-target.php
      - name: Verify shared Place pricing
        run: php tools/tests/place-pricing.php
      - name: Verify dedicated Campsite Pricing and Admin asset loading
        run: |
          npm install --prefix "$RUNNER_TEMP/llama-pricing-ui" --no-save --ignore-scripts jsdom@26.1.0
          node tools/tests/campsite-pricing-contract.cjs
          node tools/tests/closure-schedule-contract.cjs
          node tools/tests/public-facility-resource-roles.cjs
          NODE_PATH="$RUNNER_TEMP/llama-pricing-ui/node_modules" node tools/tests/site-map-pin-removal-ui.cjs
          php -l admin/campsite-pricing.php
          node --check js/admin/campsite-pricing.js
          node --check js/contribution-tabs.js
          php tools/tests/contribution-four-tab-switcher.php
          NODE_PATH="$RUNNER_TEMP/llama-pricing-ui/node_modules" node tools/tests/contribution-four-tab-switcher.cjs
          node --check js/place-report-warnings.js
          node --check js/place-explorer.js
          NODE_PATH="$RUNNER_TEMP/llama-pricing-ui/node_modules" node tools/tests/place-explorer-colors-ui.cjs
          NODE_PATH="$RUNNER_TEMP/llama-pricing-ui/node_modules" node tools/tests/area-purple-report-ui.cjs
          NODE_PATH="$RUNNER_TEMP/llama-pricing-ui/node_modules" node tools/tests/area-selection-deep-link-ui.cjs
          NODE_PATH="$RUNNER_TEMP/llama-pricing-ui/node_modules" node tools/tests/place-report-scope-visibility-ui.cjs
          php tools/tests/place-area-scope-registry.php
          node --check js/place-campsites.js
          node --check js/place-stay-selection-map.js
          NODE_PATH="$RUNNER_TEMP/llama-pricing-ui/node_modules" node tools/tests/quick-warning-ui.cjs
          node --check js/admin/place-report-photos.js
          node --check js/photo-gallery-editor.js
          node --check js/admin/resources.js
          NODE_PATH="$RUNNER_TEMP/llama-pricing-ui/node_modules" node tools/tests/admin-photo-gallery-ui.cjs
          NODE_PATH="$RUNNER_TEMP/llama-pricing-ui/node_modules" node tools/tests/admin-resource-gallery-ui.cjs
          node --check js/admin/place-report-save.js
          node --check js/photo-uploader.js
          NODE_PATH="$RUNNER_TEMP/llama-pricing-ui/node_modules" node tools/tests/photo-tab-routing.cjs
          NODE_PATH="$RUNNER_TEMP/llama-pricing-ui/node_modules" node tools/tests/admin-all-sites-ui.cjs
      - name: Verify coordinate and Site visibility contract
        if: always()
        run: php tools/coordinate-visibility-smoke.php
      - name: Verify public Place photo access contract
        if: always()
        run: php tools/place-photo-access-smoke.php
      - name: Verify canonical Place page access contract
        if: always()
        run: php tools/place-page-access-smoke.php
