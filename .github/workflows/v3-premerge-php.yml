name: V3 Pre-merge PHP Check

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/v3-premerge-php.yml'
      - '**/*.php'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  php-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: PHP syntax check for files changed from main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          mapfile -d '' files < <(git diff --name-only --diff-filter=ACMR -z origin/main...HEAD -- '*.php')
          printf 'Checking %s PHP files\n' "${#files[@]}"
          for file in "${files[@]}"; do
            php -l "$file"
          done
      - name: Verify reporting contract
        run: php tools/v3-launch-smoke.php
      - name: Verify shared Place pricing
        run: php tools/tests/place-pricing.php
      - name: Verify coordinate and Site visibility contract
        if: always()
        run: php tools/coordinate-visibility-smoke.php
      - name: Verify public Place photo access contract
        if: always()
        run: php tools/place-photo-access-smoke.php
      - name: Verify canonical Place page access contract
        if: always()
        run: php tools/place-page-access-smoke.php
