name: V3 Pre-merge PHP Check

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/v3-premerge-php.yml'
      - '**/*.php'
      - 'js/place-report-warnings.js'
      - 'css/site/features/scout-warning-compact.css'
      - 'tools/tests/quick-warning-ui.cjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  php-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: PHP syntax check for files changed from main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          mapfile -d '' files < <(git diff --name-only --diff-filter=ACMR -z origin/main...HEAD -- '*.php')
          printf 'Checking %s PHP files\n' "${#files[@]}"
          for file in "${files[@]}"; do
            php -l "$file"
          done
      - name: Verify reporting contract
        run: php tools/v3-launch-smoke.php
      - name: Verify shared Place pricing
        run: php tools/tests/place-pricing.php
      - name: Verify pricing editor and Admin asset loading
        run: |
          npm install --prefix "$RUNNER_TEMP/llama-pricing-ui" --no-save --ignore-scripts jsdom@26.1.0
          NODE_PATH="$RUNNER_TEMP/llama-pricing-ui/node_modules" node tools/tests/place-pricing-ui.cjs
          NODE_PATH="$RUNNER_TEMP/llama-pricing-ui/node_modules" node tools/tests/place-pricing-assets.cjs
          node --check js/contribution-tabs.js
          node --check js/place-report-warnings.js
          NODE_PATH="$RUNNER_TEMP/llama-pricing-ui/node_modules" node tools/tests/quick-warning-ui.cjs
          node --check js/admin/place-report-photos.js
          node --check js/photo-gallery-editor.js
          node --check js/admin/resources.js
          NODE_PATH="$RUNNER_TEMP/llama-pricing-ui/node_modules" node tools/tests/admin-photo-gallery-ui.cjs
          NODE_PATH="$RUNNER_TEMP/llama-pricing-ui/node_modules" node tools/tests/admin-resource-gallery-ui.cjs
          node --check js/admin/place-report-save.js
          node --check js/photo-uploader.js
          NODE_PATH="$RUNNER_TEMP/llama-pricing-ui/node_modules" node tools/tests/photo-tab-routing.cjs
          NODE_PATH="$RUNNER_TEMP/llama-pricing-ui/node_modules" node tools/tests/admin-all-sites-ui.cjs
      - name: Verify coordinate and Site visibility contract
        if: always()
        run: php tools/coordinate-visibility-smoke.php
      - name: Verify public Place photo access contract
        if: always()
        run: php tools/place-photo-access-smoke.php
      - name: Verify canonical Place page access contract
        if: always()
        run: php tools/place-page-access-smoke.php
