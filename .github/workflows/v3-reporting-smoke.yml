name: V3 Reporting Smoke Tests

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v3-reporting-smoke.yml'
      - 'tools/v3-launch-smoke.php'
      - 'tools/tests/season-builder-ui.cjs'
      - 'app/place-report/**'
      - 'app/admin-place-actions.php'
      - 'admin/place.php'
      - 'admin/partials/place-report-seasons.php'
      - 'admin/partials/place-report-season-answers.php'
      - 'admin/partials/place-season-bulk-status.php'
      - 'js/admin/place-season-bulk-status.js'
      - 'api/place-campsites.php'
      - 'api/place-campsite-detail.php'
      - 'partials/place/scout-report/index.php'
      - 'partials/place-report/read-only.php'
      - 'js/place-campsites.js'
      - 'js/place-report-seasons.js'
      - 'js/admin/place-map.js'
      - 'js/admin/place-season-builder.js'
      - 'admin/partials/place-map.php'
      - 'css/admin/pages/place.css'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/v3-reporting-smoke.yml'
      - 'tools/v3-launch-smoke.php'
      - 'app/place-report.php'
      - 'app/place-report/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reporting-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: PHP syntax check
        run: |
          php -l tools/v3-launch-smoke.php
          php -l app/place-report/season-definitions.php
          php -l app/place-report/season-answer-contract.php
          php -l app/place-report/season-answers.php
          php -l app/admin-place-actions.php
          php -l admin/place.php
          php -l admin/partials/place-report-seasons.php
          php -l admin/partials/place-report-season-answers.php
          php -l admin/partials/place-season-bulk-status.php
          php -l app/place-report/season-public.php
          php -l app/place-report/season-builder.php
          php -l app/place-report/site-booking.php
          php -l admin/partials/place-map.php
          php -l api/place-campsites.php
          php -l api/place-campsite-detail.php
          php -l partials/place/scout-report/index.php
          php -l partials/place-report/read-only.php
      - name: JavaScript syntax check
        run: |
          node --check js/place-campsites.js
          node --check js/place-report-seasons.js
          node --check js/admin/place-season-bulk-status.js
          node --check js/admin/place-season-builder.js
          node --check js/admin/place-map.js
      - name: Run V3 reporting smoke tests
        run: php tools/v3-launch-smoke.php
      - name: Install isolated DOM test dependency
        run: |
          mkdir -p "$RUNNER_TEMP/llama-season-ui-tests"
          npm install --prefix "$RUNNER_TEMP/llama-season-ui-tests" --no-save --no-package-lock jsdom@26
      - name: Exercise seasonal Add Change and Save in a browser DOM
        env:
          NODE_PATH: ${{ runner.temp }}/llama-season-ui-tests/node_modules
        run: node tools/tests/season-builder-ui.cjs
