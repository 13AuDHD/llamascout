name: V3 Reporting Smoke Tests

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v3-reporting-smoke.yml'
      - 'tools/v3-launch-smoke.php'
      - 'app/place-report/**'
      - 'app/admin-place-actions.php'
      - 'admin/place.php'
      - 'admin/partials/place-report-seasons.php'
      - 'admin/partials/place-report-season-answers.php'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/v3-reporting-smoke.yml'
      - 'tools/v3-launch-smoke.php'
      - 'app/place-report.php'
      - 'app/place-report/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reporting-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: PHP syntax check
        run: |
          php -l tools/v3-launch-smoke.php
          php -l app/place-report/season-definitions.php
          php -l app/place-report/season-answer-contract.php
          php -l app/place-report/season-answers.php
          php -l app/admin-place-actions.php
          php -l admin/place.php
          php -l admin/partials/place-report-seasons.php
          php -l admin/partials/place-report-season-answers.php
      - name: Run V3 reporting smoke tests
        run: php tools/v3-launch-smoke.php
