name: NPS Source Enrichment Checks

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/nps-enrichment-smoke.yml'
      - 'app/nps-batch-fill.php'
      - 'app/nps-place-fill.php'
      - 'app/nps-publication-readiness.php'
      - 'app/nps-reviewed-publication-plan.php'
      - 'admin/nps-place-fill.php'
      - 'tools/tests/nps-batch-fill-smoke.php'
      - 'tools/tests/nps-publication-readiness-smoke.php'
      - 'tools/tests/nps-reviewed-publication-plan-smoke.php'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/nps-enrichment-smoke.yml'
      - 'app/nps-batch-fill.php'
      - 'app/nps-place-fill.php'
      - 'app/nps-publication-readiness.php'
      - 'app/nps-reviewed-publication-plan.php'
      - 'admin/nps-place-fill.php'
      - 'tools/tests/nps-batch-fill-smoke.php'
      - 'tools/tests/nps-publication-readiness-smoke.php'
      - 'tools/tests/nps-reviewed-publication-plan-smoke.php'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  nps-source-enrichment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: PHP syntax
        run: |
          php -l app/nps.php
          php -l app/nps-place-fill.php
          php -l app/nps-batch-fill.php
          php -l app/nps-publication-readiness.php
          php -l app/nps-reviewed-publication-plan.php
          php -l admin/nps-place-fill.php
          php -l tools/tests/nps-batch-fill-smoke.php
          php -l tools/tests/nps-publication-readiness-smoke.php
          php -l tools/tests/nps-reviewed-publication-plan-smoke.php
      - name: NPS batch identity and pagination safety
        run: php tools/tests/nps-batch-fill-smoke.php
      - name: NPS reviewed-to-published coverage safety
        run: php tools/tests/nps-publication-readiness-smoke.php
      - name: Reviewed NPS field destination and blockers
        run: php tools/tests/nps-reviewed-publication-plan-smoke.php
